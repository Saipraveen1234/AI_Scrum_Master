services:
  db:
    image: postgres:15
    container_name: postgres_scrum
    restart: always
    environment:
      POSTGRES_USER: ai_scrum_master_user
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: ai_scrum_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis_scrum
    ports:
      - "6379:6379"

volumes:
  postgres_data:
